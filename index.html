
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114年度USR 活動成果</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="usr-section">

        <header class="usr-header">
            <img
                src="usr-logo.png"
                alt="USR 大學社會責任標章"
                class="usr-logo"
            >

            <div class="header-content">
                <h1>114年度USR 活動成果</h1>
                <div class="title-decoration">
                    <span></span>
                </div>
            </div>
        </header>

        <section class="stats" aria-label="USR 活動成果統計">

            <div class="stat">
                <div class="number" data-target="399">0</div>
                <div class="label">校內教師</div>
            </div>

            <div class="stat">
                <div class="number" data-target="1355">0</div>
                <div class="label">校內學生</div>
            </div>

            <div class="stat">
                <div class="number" data-target="335">0</div>
                <div class="label">校內助理</div>
            </div>

            <div class="stat">
                <div class="number" data-target="612">0</div>
                <div class="label">跨校教師</div>
            </div>

            <div class="stat">
                <div class="number" data-target="704">0</div>
                <div class="label">跨校學生</div>
            </div>

            <div class="stat">
                <div class="number" data-target="1513">0</div>
                <div class="label">跨校助理</div>
            </div>

            <div class="stat">
                <div class="number" data-target="792">0</div>
                <div class="label">場域夥伴</div>
            </div>

            <div class="stat">
                <div class="number" data-target="13">0</div>
                <div class="label">其他中央</div>
            </div>

            <div class="stat">
                <div class="number" data-target="24">0</div>
                <div class="label">其他地方</div>
            </div>

            <div class="stat">
                <div class="number" data-target="210">0</div>
                <div class="label">NPO/NGO</div>
            </div>

        </section>

        <footer class="usr-footer">
            114年度 USR 活動成果統計
        </footer>

    </main>

    <script>
        const numbers = document.querySelectorAll(".number");

        function animateNumber(element) {
            const target = Number(element.dataset.target);
            const duration = 1200;
            const startTime = performance.now();

            function update(currentTime) {
                const progress = Math.min(
                    (currentTime - startTime) / duration,
                    1
                );

                const eased = 1 - Math.pow(1 - progress, 3);
                const value = Math.round(target * eased);

                element.textContent = value.toLocaleString();

                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    element.textContent = target.toLocaleString();
                }
            }

            requestAnimationFrame(update);
        }

        const stats = document.querySelector(".stats");

        const observer = new IntersectionObserver(
            function (entries, observer) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        numbers.forEach(function (number) {
                            animateNumber(number);
                        });

                        observer.disconnect();
                    }
                });
            },
            { threshold: 0.3 }
        );

        observer.observe(stats);
    </script>

</body>
</html>
